# ==============================================================================
# Helm Charts 配置
# ==============================================================================

helm:
  repo: "https://charts.example.com/precisionqa"
  release_name: "precisionqa"
  namespace_prefix: "precisionqa"

  charts:
    coverage-collector:
      chart: "coverage-collector"
      version: "1.0.0"
    dependency-analyzer:
      chart: "dependency-analyzer"
      version: "1.0.0"
    impact-analyzer:
      chart: "impact-analyzer"
      version: "1.0.0"
    recommendation-engine:
      chart: "recommendation-engine"
      version: "1.0.0"
    web-console:
      chart: "web-console"
      version: "1.0.0"

# ==============================================================================
# 监控配置
# ==============================================================================

monitoring:
  enabled: true
  service_monitor: true
  prometheus_rules: true
  grafana_dashboards: true

  alerts:
    - name: HighErrorRate
      severity: warning
      threshold: 0.05
      duration: 5m
    - name: HighLatency
      severity: warning
      threshold: 1.0
      duration: 5m
    - name: PodNotReady
      severity: critical
      duration: 2m
    - name: DatabaseConnectionFailed
      severity: critical
      duration: 1m

# ==============================================================================
# 调试模式配置（开发环境使用）
# ==============================================================================

debug:
  enabled: false
  log_file: "logs/auto_task_debug.log"
  verbosity: "detailed"
  include_environment_variables: false
  dry_run: false

# ==============================================================================
# 自定义阻塞条件
# ==============================================================================

custom_blocking_conditions:
  - condition: "Unit test coverage below 80%"
    action: "ask"
    check_command: "pytest --cov=services --cov-report=term-missing | grep TOTAL | awk '{print $4}' | sed 's/%//'"
    threshold: 80

  - condition: "Integration test failed"
    action: "stop"
    check_command: "pytest tests/integration/ -q"

  - condition: "Docker image build failed"
    action: "stop"
    check_command: "docker build -t test-image ."

  - condition: "Helm lint failed"
    action: "stop"
    check_command: "helm lint precisionqa/"

# ==============================================================================
# 回滚配置
# ==============================================================================

rollback:
  enabled: true
  auto_rollback_on_failure: true
  max_rollback_attempts: 3
  rollback_timeout: 300

  backup:
    enabled: true
    backup_before_deploy: true
    backup_location: "s3://precisionqa-backups"

# ==============================================================================
# 通知配置
# ==============================================================================

notifications:
  enabled: true
  channels:
    slack:
      webhook_url: "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"
      channel: "#precisionqa-deployments"
      username: "PrecisionQA Bot"
      icon_emoji: ":rocket:"

    email:
      enabled: false
      to: "team@example.com"
      from: "precisionqa@example.com"
      smtp_server: "smtp.example.com"
      smtp_port: 587

