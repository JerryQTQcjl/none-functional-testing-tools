# ==============================================================================
# AUTO_TASK_CONFIG - PrecisionQA 精准测试平台
# ==============================================================================

execution:
  mode: semi-auto
  max_parallel_tasks: 3
  stop_on_failure: true
  auto_commit: true
  commit_message_prefix: "[precisionqa]"

branch:
  name: "feature/precisionqa-platform"
  create_if_missing: true
  base_branch: "main"

commit:
  auto_stage: true
  conventional_commits: true
  message_template: "[type]([scope]): [description]"

status_tracking:
  file: "myspec/changes/precision_testing_20260425/TASKS_precision_testing_20260425.md"
  format: "emoji"
  update_frequency: "after_each_task"

progress_documentation:
  enabled: true
  file: "myspec/changes/precision_testing_20260425/PROGRESS_precision_testing_20260425.md"
  include_timestamps: true

blocking_conditions:
  - condition: "Uncommitted changes in working directory"
    action: "stop"
  - condition: "Kubernetes cluster unreachable"
    action: "stop"
  - condition: "Database connection failed"
    action: "stop"
  - condition: "Docker image not found"
    action: "stop"
  - condition: "Unit tests failed"
    action: "ask"

environments:
  order: ["dev", "test", "staging", "prod"]
  deploy_sequence: true
  require_approval: ["staging", "prod"]

  overrides:
    dev:
      execution:
        mode: auto
      validation:
        post_task:
          - "kubectl get pods -n precisionqa-dev"
          - "curl -sf http://coverage-collector-dev/api/health"
    staging:
      execution:
        mode: semi-auto
      validation:
        post_task:
          - "kubectl get pods -n precisionqa-staging"
          - "curl -sf https://precisionqa-staging.example.com/health"
          - "pytest tests/integration/test_staging.py"
    prod:
      execution:
        mode: semi-auto
        max_parallel_tasks: 1
      validation:
        post_task:
          - "kubectl get pods -n precisionqa-prod"
          - "curl -sf https://precisionqa.example.com/health"
          - "pytest tests/integration/test_prod.py"

validation:
  pre_task:
    - "kubectl cluster-info"
    - "kubectl get nodes"
    - "docker ps"
  post_task:
    - "kubectl get pods -n precisionqa-dev"
    - "kubectl describe deployment <service-name> -n precisionqa-dev"
    - "kubectl logs -l app=<service-name> -n precisionqa-dev --tail=50"
  pre_phase:
    - "helm list -n precisionqa-dev"
    - "kubectl get ns precisionqa-dev || kubectl create ns precisionqa-dev"
  post_phase:
    - "helm test <release-name> -n precisionqa-dev"
    - "pytest tests/integration/ -k precisionqa --tb=short -q"

